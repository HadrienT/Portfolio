name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio .
      - name: Smoke test
        run: |
          docker run -d --name site -p 8080:8080 portfolio
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/projects/quant-modeling | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/price)" = 301
          curl -sfI http://localhost:8080/cv.pdf | grep -qi '^content-type: application/pdf'
