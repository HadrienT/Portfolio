# Static SPA, served behind cloudflared on the compose network (no TLS here:
# Cloudflare terminates it). No API proxy: the pricing app has its own host.

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_vary on;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Old links to the pricing app (it used to live on this host) → its new home.
    location ~ ^/(price|market|credit|xva|rates|scripting|visualize|dated-asian|portfolio|backtest|simulation|products|about|legal|privacy|terms|profile|api)(/|$) {
        return 301 https://quant.tramonihadrien.com$request_uri;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|env|git)$ { return 444; }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
